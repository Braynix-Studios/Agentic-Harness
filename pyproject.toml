[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "p3-agentic-harness"
version = "0.1.0"
description = "A modular, contract-first agentic harness"
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "P3 Engineering Team" }]
dependencies = []

[project.optional-dependencies]
dev = [
  "pytest>=9.0.3,<10.0",
  "ruff>=0.9,<1.0",
  "mypy>=1.13,<3.0",
  "pytest-cov>=6.0,<7.0",
  "pip-audit>=2.7,<3.0",
]

[tool.setuptools.packages.find]
include = ["p3*", "core*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-config --strict-markers"

[tool.mypy]
python_version = "3.11"
strict = true
files = ["core", "p3"]
show_error_codes = true
warn_unused_configs = true

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
